<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lingo Bati</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌍 Lingo Bati</h1>

        <p>Langueage translator </p>

        <div class="translator">

            <div class="box">

              <select id="fromLanguage">
    <option value="en">🇬🇧 English</option>
    <option value="om">🇪🇹 Afaan Oromoo</option>
    <option value="am">🇪🇹 Amharic</option>
    <option value="zh">🇨🇳 Chinese</option>
    <option value="es">🇪🇸 Spanish</option>
    <option value="fr">🇫🇷 French</option>
    <option value="ar">🇸🇦 Arabic</option>
    <option value="ru">🇷🇺 Russian</option>
    <option value="de">🇩🇪 German</option>
    <option value="pt">🇵🇹 Portuguese</option>
    <option value="hi">🇮🇳 Hindi</option>
</select>

                <textarea
                    id="inputText"
                    placeholder="Barruu kee asitti barreessi..."></textarea>

                <button id="copyInput">📋 Copy</button>

            </div>

            <button id="swapBtn">🔄</button>

            <div class="box">

                <select id="toLanguage">
    <option value="en">English</option>
    <option value="om">Afaan Oromoo</option>
    <option value="am">Amharic</option>
    <option value="zh">Chinese</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="ar">Arabic</option>
    <option value="ru">Russian</option>
    <option value="de">German</option>
    <option value="pt">Portuguese</option>
    <option value="hi">Hindi</option>
</select>

                <textarea
                    id="outputText"
                    placeholder="Translation appears here..."
                    readonly></textarea>

                <button id="copyOutput">📋 Copy</button>

            </div>

        </div>

        <<button id="micBtn">🎤 Speak</button>
<button id="translateBtn">Translate</button>">
            Translate
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
